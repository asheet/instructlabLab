      ## Section 12. Disqualified Player
      Art. 1. A disqualified player is one who is barred from further participation in a game after receiving a fifth foul, including personal fouls and Class A technical fouls or a player shall be disqualified for receiving three Flagrant 1 fouls.
      Art.  2. A  team  member  who  leaves  the  bench  area  during  a  fight  shall  be disqualified and ejected.
      Art. 3. The officials shall first notify the head coach of any disqualification and then the player.
      Art. 4. When the head coach is notified by an official that a player is disqualified, that player becomes bench personnel, except when the disqualified individual is ejected.
      Art. 5. A disqualified player shall be replaced within a 20-second time limit. A horn shall be sounded both 15 seconds before the expiration of this time limit and at the end of the time limit, with the latter horn indicating that play shall resume immediately.
    questions_and_answers:
      - question: >-
          If the player has now earned a fifth foul, can the player still participate in the game?
        answer: No, the player is disqualified from further participation in the game because a player cannot earn more than 5 fouls.
      - question: >-
          If a player is disqualified by fouling out, can the head coach be notified?
        answer: >-
          Yes, the officials shall notify the head coach that the player has been disqualified.
      - question: >-
          If the player has earned three Flagrant 1 fouls, can the player still participate in the game?
        answer: No, the player cannot participate in the game because the player has been disqualified since the player has earned three Flagrant 1 fouls.
  - context: >-
      ## Section 3. Forfeit/No Contest
      - Art. 1. A forfeit is the termination of the game by the referee by declaring one team the winner by forfeit.
      - Art. 2. The referee shall declare a forfeit when:
      - a.  Any player, team member or bench personnel fails to comply with any flagrant or technical-foul penalty or makes a travesty of the game.
      - b.  When conditions warrant.
      - c. A team refuses to play after being instructed to do so by an official.
      - Art. 3. The referee shall determine the length of time that shall elapse before a forfeit may be declared.
      - Art.  4. Conference  policy  may  include  an  established  time  limit  before  the referee may declare a forfeit.
      - Art. 5. When a forfeit is declared, the score shall be recorded as 2-0 and all statistics (other than the teams' and head coaches' won-lost records) shall be voided, unless 30 minutes of playing time has been completed on the game clock. In that case, the score at the end of play shall stand and all other statistics shall count.
      - Art.  6. When  the  team  that  is  behind  in  the  scorebook  is  to  be  declared the  winning  team,  that  score  shall  be  marked  with  an  asterisk  in  the  official statistics; and it shall be noted that the game was won by forfeit.
      - Art. 7. A 'no contest' is when a team does not appear at the game site because of  inclement  weather,  an  accident,  vehicle  breakdown,  illness  or  catastrophic cause. An institution shall not, for statistical purposes, declare a forfeit for nonfulfillment of a contract, but rather shall declare a 'no contest.' When officials are  not  present  or  available  to  officiate,  there  cannot  be  a  sanctioned  game/ contest.
    questions_and_answers:
      - question: >-
          If there a forfeit, what is the score that will be recorded?
        answer: There will be a score of 2-0 recorded.
      - question: >-
          If a team does not show up to the game site because of inclement weather, what is the score that will be recorded?
        answer: >-
          The score will be recorded as a 'no contest' and the institution shall not declare a forfeit for nonfulfillment of a contract.
      - question: >-
          If a team has played 35 minutes of the game and one of the teams forfeits, what is the score that will be recorded?
        answer: >-
          The score will be recorded as the score at the end of play and all other statistics shall count because there was 30 minutes of playing time completed on the game clock.
  - context: >-
      Playing Area. When possible, building plans should provide for a playing court with ideal measurements as stated in Rule 1-2 and listed on the court diagram, ample out-of-bounds area and needed seating space for scorers, timers and fans. A long playing court permits use of two crosswise courts for practice and informal games.
      It is recommended that padding that meets current ASTM standards be used on walls and other facility features in or around the playing area that a student-athlete might contact during play. Padding should be installed no more than 4 inches from the floor up to 6 feet.

      Warning on Misuse of Portable Backstops. Manufacturers and administrators should be aware of an 'extreme-caution' warning relative to the misuse of portable backstops. A high degree of injury potential and a severe liability problem exist when anyone is allowed to hang, sit or stand on the basket ring or backboard. Administrators must see that this practice is prohibited or that the portable units are lowered at the completion of the game because of the high risk of severe injury, even death. A recommended warning or inscription such as 'Danger-please do not get on the rim/ backboard' is desirable.
      Locking Backboard. It is recommended that a locking device/safety arrester be used for ceiling and wall-mount backboard systems that are retracted by motor-pulley cable arrangements.
      Backboard Padding. It is recommended that the required padding for the backboard be mounted on the backboard by adhesive or material such as Velcro or channel. The bottom and each side of the backboards shall be padded with a Poly High-Car vinyl-type material that meets the Bashor resilience test with a range of 20-30.
      A lavaliere-type microphone properly positioned in the crease of the backboard padding or between padding and backboard is permitted since it is not located on the padding and does not interfere with a live ball or create a safety hazard.

      Divisions I, II and III schools shall have either a red light placed behind each backboard that is visible through the 24-inch-by-18-inch rectangle or LED lights around the backboard. The purpose of either is to indicate when player activity is terminated. If LED lights are used, they shall be positioned not more than 6 inches from the upper and lower edges of the backboard and not more than 5 inches from the side of each backboard. When both lights are present, the LED lights shall take precedence, and the red light shall be disconnected. It is recommended that the game clock, red light or LED lights be updated in their synchronization.

      It is recommended that all men's Division I arenas provide a timing mechanism that enables the officials to start and stop the game clock automatically. It is permissible also to have LED lights at the scorers' table which are synchronized with the red lights/LED lights on the backboards and game clocks.

      A pole attached to the shot clock that is used to mount a camera or a camera attached to the shot clock is permissible when the shot clock is recessed behind the backboard and does not interfere with a live ball, nor does it affect the visibility of the shot clock.
    question_and_answers:
      - question: >-
          What are the safety and installation recommendations for padding around the playing area and backboard?
        answer: >-
          Padding around the playing area should meet current ASTM standards and be installed no more than 4 inches from the floor up to 6 feet. For the backboard, the required padding must be mounted using adhesive, Velcro, or channel, and must use Poly High-Car vinyl-type material that meets the Bashor resilience test (range 20-30). A lavaliere-type microphone may be placed between the padding and backboard if it does not pose a hazard.
      - question: >- 
          What are the requirements and recommendations for basket rings in NCAA games?
        answer: >- 
          Movable basket rings are required and must have the same rebound characteristics as nonmovable ones. The pressure-release mechanism should both protect and enhance rebound behavior. For men's Division I, ring rebound/elasticity testing is mandatory before the season and postseason; it is recommended for Divisions II and III. The ring should not rotate more than 30 degrees downward upon release and must return to the original position immediately after the load is removed.
      - question: >- 
          What are the specifications for timing and lighting equipment in NCAA Division I, II, and III arenas?
        answer: >- 
          Arenas must have a game clock with 1/10th-of-a-second display for the final minute of each period. A red light behind each backboard or LED lights around the backboard must indicate the end of player activity; LED lights take precedence if both are used. The lights must be synchronized with the game clock. Additionally, it is recommended that Division I arenas provide automatic timing mechanisms for officials and allow synchronized LED lights at the scorers' table.
