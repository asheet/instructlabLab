      ## Section 7. Officials' Duties
        During the game, officials shall:
        - Art. 1. Put the ball in play.
        - Art. 2. Determine when the ball becomes dead.
        - Art. 3. Prohibit practice during a dead ball, except between halves.
        - Art. 4. Administer penalties.
        - Art. 5. Grant and charge timeouts.
        - Art. 6. Correct errors and mistakes within the prescribed time frames. Officials may use play-by-play, a digital stopwatch, table officials (including an approved standby official) and Instant Replay as set forth in Rule 11 to correct errors and mistakes.
        - Art. 7. Beckon substitutes to enter the playing court.
        - Art. 8. Indicate a three-point attempt and signal a successful three-point goal.
        - Art. 9. Silently and visibly count seconds to administer throw-ins, free-throws, and closely guarded rules and silently count for enforcement of the three-second rule.  Use the shot clock to administer the 10-second backcourt count. Use a visible 10-second count when there is no shot clock visible.
        - Art. 10. Notify the captains and head coaches when play is about to begin after an intermission or a timeout.
        - Art. 11. Report a warning for delay to the official scorer and head coaches. (See Rules 4-10.2 and 4-32.2.)
        - Art. 12. Signal the official timer to stop the game clock when a foul occurs, designate  the  offender  to  the  official  scorer  and  indicate  with  finger(s)  the number of free throws.
        - Art. 13. Clearly signal, when a team is entitled to a throw-in:
        - a.  The act that caused the ball to become dead.
        - b.  The team entitled to the throw-in.
        - c. The designated spot, unless the throw-in comes after a successful goal or an awarded goal.
        - Art. 14. Notify a team and its head coach when a team takes its final allowable charged timeout.
        - Art. 15. Signal the scorer to record the time that a possible correctable error has occurred for a two- or three-point goal, which will be reviewed at the next electronic-media timeout per Rule 11-2.1.b.1. No signal is required during the last four minutes of the second period or during all of any extra period(s).
        - Art. 16. Notify game management of any potentially dangerous situations on the playing court, including the 3-foot area outside each sideline and the 6-foot area outside each end line, the basket and backboard supports and/or any other equipment situations.
    questions_and_answers:
      - question: >-
          When a shooter attempts a three point shot, does the official indicate
          and signal a three point shot?
        answer: Yes, the official will need to indicate and signal a three point shot.
      - question: >-
          If there is an error within the foul call, can the officials correct
          and fix the error?
        answer: >-
          Yes, the officials can correct the error by using a play-by-play, a
          digital stopwatch, table officials (including an approved standby
          official) and Instant Replay to review the error and fix it.
      - question: >-
          If the basketball is out of play, can the official put the ball in
          play?
        answer: Yes, the official determines if the ball is in play.
